<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover habilita env(safe-area-inset-*). Necessário para a
         barra inferior do painel não ficar sob a barra de gestos no APK: o
         targetSdk 34 faz o Android 15 forçar edge-to-edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Content-Security-Policy: Mitiga injeções XSS e restringe conexões externas -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; media-src 'self' blob:;" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Boomii — Fidelidade digital na carteira do seu cliente</title>
    <meta name="description" content="Cartão de fidelidade por selos direto na Apple Wallet e Google Wallet. Sem app, sem senha, sem cobrança por cliente." />
    <meta name="author" content="Boomii" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Boomii — Fidelidade digital na carteira do seu cliente" />
    <meta property="og:description" content="Cartão de fidelidade por selos direto na Apple Wallet e Google Wallet. Sem app para o cliente baixar." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Boomii — Fidelidade digital na carteira do seu cliente" />
    <meta name="twitter:description" content="Cartão de fidelidade por selos direto na Apple Wallet e Google Wallet. Sem app para o cliente baixar." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Aplica o tema antes da primeira pintura. Se ficasse só no React, a
      // página piscaria no tema errado até o bundle carregar.
      (function () {
        try {
          if (localStorage.getItem('boomii_tema') !== 'claro') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-primary selection:text-primary-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
